name: Graphics SDK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CORE_REVISION: 4f973b0b81f5857944225ccc4ae3fe1106598689

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Graphics
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout pinned Core
        uses: actions/checkout@v4
        with:
          repository: mirmik/termin-core
          ref: ${{ env.CORE_REVISION }}
          path: termin-core
          submodules: recursive

      - uses: arduino/setup-task@v2
        with:
          version: 3.51.1

      - name: Install Linux graphics dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Install pinned Slang compiler
        uses: ./.github/actions/setup-slang

      - name: Build pinned Core SDK input
        working-directory: termin-core
        run: task build

      - name: Build and verify standalone Graphics
        run: |
          task test -- \
            --core-sdk "${{ github.workspace }}/termin-core/sdk"

      - name: Publish verified Linux Graphics SDK
        uses: actions/upload-artifact@v4
        with:
          name: termin-graphics-sdk-linux-x86_64-py314t-core-4f973b0
          path: sdk/
          if-no-files-found: error
          retention-days: 14
