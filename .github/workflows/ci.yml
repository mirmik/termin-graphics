name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-sdk-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirmik/termin-core
          ref: d860ca231693ed0b1eaa52e0a6121c15c9e0966b
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build installed Core SDK input
        run: ./build-sdk.sh
      - uses: actions/upload-artifact@v5
        with:
          name: core-sdk-linux
          path: sdk/
          retention-days: 1

  core-sdk-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirmik/termin-core
          ref: d860ca231693ed0b1eaa52e0a6121c15c9e0966b
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build installed Core SDK input
        shell: pwsh
        run: .\build-sdk.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: core-sdk-windows
          path: sdk/
          retention-days: 1

  core-sdk-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirmik/termin-core
          ref: d860ca231693ed0b1eaa52e0a6121c15c9e0966b
      - name: Build installed Android Core SDK input
        run: ./build-sdk-android.sh --ndk "$ANDROID_NDK_LATEST_HOME"
      - uses: actions/upload-artifact@v5
        with:
          name: core-sdk-android-arm64-v8a
          path: sdk-platform/android/arm64-v8a/
          retention-days: 1

  core-sdk-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mirmik/termin-core
          ref: d860ca231693ed0b1eaa52e0a6121c15c9e0966b
      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains/emsdk
          key: core-emsdk-${{ runner.os }}-${{ hashFiles('build-system/emscripten-version.txt') }}
      - name: Build installed Web Core SDK input
        run: ./build-sdk-web.sh --setup
      - uses: actions/upload-artifact@v5
        with:
          name: core-sdk-web-wasm32
          path: sdk-platform/web/wasm32/
          retention-days: 1

  # ── 0. Python lint ─────────────────────────────────────────────
  core-consumer-source-hidden-linux:
    needs: core-sdk-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang
      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk/
      - name: Build graphics with Core sources absent
        run: |
          scripts/smoke-installed-core-source-hidden \
            --profile graphics \
            --core-sdk "${{ github.workspace }}/core-sdk"
      - name: Build and prove the standalone Graphics SDK
        run: |
          ./build-sdk.sh \
            --profile graphics \
            --core-sdk "${{ github.workspace }}/core-sdk"
          scripts/smoke-installed-graphics-consumers \
            --sdk-root "${{ github.workspace }}/sdk" \
            --slangc "$TERMIN_SLANGC"

  core-consumer-source-hidden-windows:
    needs: core-sdk-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-windows
          path: core-sdk/
      - name: Build graphics with Core sources absent
        shell: pwsh
        run: |
          $coreSdk = (Resolve-Path core-sdk).Path
          foreach ($directory in @(
            "termin-base", "termin-dispatch", "termin-inspect", "termin-mcp",
            "termin-nanobind-sdk", "termin-python-host"
          )) {
            if (Test-Path $directory) {
              throw "Core source directory must not exist in Termin: $directory"
            }
          }
          New-Item -ItemType Directory -Force sdk | Out-Null
          Copy-Item core-sdk\* sdk\ -Recurse -Force
          $env:TERMIN_CORE_SDK = $coreSdk
          .\build-sdk-bindings.ps1 --profile=graphics --no-vulkan --no-opengl --no-sdl

  core-consumer-source-hidden-android:
    needs: core-sdk-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-android-arm64-v8a
          path: core-sdk-android/
      - name: Build Android with Core sources absent
        run: |
          scripts/smoke-installed-core-platform-source-hidden \
            --platform android \
            --ndk "$ANDROID_NDK_LATEST_HOME" \
            --core-sdk "${{ github.workspace }}/core-sdk-android"

  core-consumer-source-hidden-web:
    needs: [core-sdk-linux, core-sdk-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk-host/
      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-web-wasm32
          path: core-sdk-web/
      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('build-system/emscripten-version.txt') }}
      - name: Setup Web toolchains
        run: |
          ./setup-web-toolchain.sh
          ./setup-web-shader-toolchain.sh
      - name: Build Web with Core sources absent
        run: |
          scripts/smoke-installed-core-platform-source-hidden \
            --platform web \
            --core-sdk "${{ github.workspace }}/core-sdk-web" \
            --host-core-sdk "${{ github.workspace }}/core-sdk-host"

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Python lint
        run: ./run-lint-python.sh --no-venv

  # ── 0a. C/C++ lint ─────────────────────────────────────────────
  lint-cpp:
    needs: core-sdk-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: clang-tidy libclang-18-dev llvm-18-dev

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk/

      - name: Select installed Core SDK input
        run: |
          echo "TERMIN_CORE_SDK=${{ github.workspace }}/core-sdk" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          manifest = json.loads(Path("core-sdk/termin-artifacts.json").read_text())
          print(f"TERMIN_CORE_BUILD_ID={manifest['native_build_id']}")
          PY

      - name: Run C/C++ lint
        run: ./run-lint-cpp.sh

      - name: Check C++ class member order
        run: |
          ./run-cpp-class-layout-check.sh --self-test
          ./run-cpp-class-layout-check.sh
          ./run-lint-cpp.sh --python-bindings --configure-only
          ./run-cpp-class-layout-check.sh --python-bindings

  # ── 0c. Build system smoke ─────────────────────────────────────
  smoke-build-system-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install pytest setuptools wheel

      - name: Validate package manifest
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\termin-build-tools"
          python -m termin_build.package_manifest --repo-root . --check

      - name: Run build-tools tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\termin-build-tools"
          python -m pytest termin-build-tools/tests/ -v

      - name: Smoke build-sdk.ps1 wrapper
        shell: pwsh
        run: .\build-sdk.ps1 --no-wheels --no-parallel --dry-run

  # ── 0e. Chromium Web Runtime gate ──────────────────────────────
  web-runtime-chromium:
    needs: [core-sdk-linux, core-sdk-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@v5
        with:
          path: build/toolchains/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('build-system/emscripten-version.txt') }}

      - name: Setup pinned Emscripten toolchain
        run: |
          ./setup-web-toolchain.sh
          ./setup-web-shader-toolchain.sh

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk-host/

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-web-wasm32
          path: core-sdk-web/

      - name: Resolve Chromium executable
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$browser" ]]; then
            echo "ERROR: GitHub runner does not provide a Chromium-family browser" >&2
            exit 1
          fi
          echo "TERMIN_WEB_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Build and run Chromium Web Runtime gate
        run: |
          host_build_id="$(python -c 'import json; print(json.load(open("core-sdk-host/termin-artifacts.json"))["native_build_id"])')"
          web_build_id="$(python -c 'import json; print(json.load(open("core-sdk-web/termin-core-platform.json"))["native_build_id"])')"
          ./build-web-core.sh --browser-smoke \
            --core-sdk "${{ github.workspace }}/core-sdk-web" \
            --core-build-id "$web_build_id" \
            --host-core-sdk "${{ github.workspace }}/core-sdk-host" \
            --host-core-build-id "$host_build_id"

      - name: Upload Web Runtime gate report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: web-runtime-chromium-gate
          path: build/web-core/bin/browser-gate-report.json
          if-no-files-found: error
          retention-days: 14

  # ── 0d. D3D11 tgfx2 smoke ─────────────────────────────────────
  tgfx2-d3d11-bound-windows:
    needs: core-sdk-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-windows
          path: core-sdk/

      - name: Select installed Core SDK input
        shell: pwsh
        run: |
          $manifest = Get-Content core-sdk/termin-artifacts.json | ConvertFrom-Json
          "TERMIN_CORE_SDK=$pwd\core-sdk" | Out-File $env:GITHUB_ENV -Append
          "TERMIN_CORE_BUILD_ID=$($manifest.native_build_id)" | Out-File $env:GITHUB_ENV -Append
          "$pwd\core-sdk\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Validate D3D11 bound resource path
        shell: pwsh
        run: |
          .\run-tests.ps1 --process-smoke-only `
            --process-smoke-profile=windows-d3d11-bound

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: d3d11-execution-manifest
          path: |
            build/process-smoke/windows-d3d11-bound/execution-manifest.json
            build/process-smoke/windows-d3d11-bound/logs/
          retention-days: 7

  # ── 1. Build C++ libraries ───────────────────────────────────────
  build-cpp-libs:
    needs: core-sdk-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk/

      - name: Seed and select installed Core SDK input
        run: |
          mkdir -p sdk
          cp -a core-sdk/. sdk/
          echo "TERMIN_CORE_SDK=${{ github.workspace }}/core-sdk" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          manifest = json.loads(Path("core-sdk/termin-artifacts.json").read_text())
          print(f"TERMIN_CORE_BUILD_ID={manifest['native_build_id']}")
          PY

      - name: Build
        run: ./build-sdk-cpp.sh

      - uses: actions/upload-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/
          retention-days: 1

  # ── 2. Test C++ libraries ────────────────────────────────────────
  test-cpp-libs:
    needs: [build-cpp-libs, core-sdk-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - name: Setup Slang compiler
        uses: ./.github/actions/setup-slang

      - uses: actions/download-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk/

      - name: Select installed Core SDK input
        run: |
          echo "TERMIN_CORE_SDK=${{ github.workspace }}/core-sdk" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          manifest = json.loads(Path("core-sdk/termin-artifacts.json").read_text())
          print(f"TERMIN_CORE_BUILD_ID={manifest['native_build_id']}")
          PY

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Run C++ tests
        run: ./run-tests-cpp.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ctest-execution-manifest
          path: |
            build/Release-tests/ctest-selection.json
            build/Release-tests/ctest-execution-manifest.json
            build/Release-tests/ctest-results.xml
          retention-days: 7

  test-cpp-windows:
    needs: core-sdk-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-windows
          path: core-sdk/

      - name: Seed and select installed Core SDK input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sdk | Out-Null
          Copy-Item core-sdk\* sdk\ -Recurse -Force
          $manifest = Get-Content core-sdk/termin-artifacts.json | ConvertFrom-Json
          "TERMIN_CORE_SDK=$pwd\core-sdk" | Out-File $env:GITHUB_ENV -Append
          "TERMIN_CORE_BUILD_ID=$($manifest.native_build_id)" | Out-File $env:GITHUB_ENV -Append
          "$pwd\core-sdk\bin" | Out-File $env:GITHUB_PATH -Append

      - name: Build C++ SDK dependencies
        shell: pwsh
        run: .\build-sdk-cpp.ps1 --no-vulkan --no-opengl --no-sdl

      - name: Run repository-controlled C++ tests
        shell: pwsh
        run: .\run-tests-cpp.ps1 --no-vulkan --no-opengl --no-sdl

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ctest-execution-manifest-windows
          path: |
            build/Release-tests/ctest-selection.json
            build/Release-tests/ctest-execution-manifest.json
            build/Release-tests/ctest-results.xml
          retention-days: 7

  # ── 3. Build nanobind SDK + Python bindings ────────────────────
  build-bindings:
    needs: [build-cpp-libs, core-sdk-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - uses: actions/download-artifact@v5
        with:
          name: sdk-cpp
          path: sdk/

      - uses: actions/download-artifact@v5
        with:
          name: core-sdk-linux
          path: core-sdk/

      - name: Select installed Core SDK input
        run: |
          echo "TERMIN_CORE_SDK=${{ github.workspace }}/core-sdk" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          manifest = json.loads(Path("core-sdk/termin-artifacts.json").read_text())
          print(f"TERMIN_CORE_BUILD_ID={manifest['native_build_id']}")
          PY

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Prepare canonical Python build environment
        env:
          PYTHONPATH: ${{ github.workspace }}/termin-build-tools
        run: |
          python -m termin_build.sdk --repo-root . prepare-python-toolchain
          echo "PYTHON_BIN=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"
          echo "PYTHON_EXECUTABLE=${{ github.workspace }}/build/python-runtime/build-env/bin/python" >> "$GITHUB_ENV"

      - name: Build bindings
        run: ./build-sdk-bindings.sh

      - name: Populate and verify bundled Python runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/termin-build-tools
        run: |
          "$PYTHON_BIN" -m termin_build.sdk --repo-root . install-python
          "$PYTHON_BIN" -m termin_build.sdk --repo-root . verify-sdk

      - uses: actions/upload-artifact@v5
        with:
          name: sdk-full
          path: sdk/
          retention-days: 1

  # ── 4. Test pip packages ───────────────────────────────────────
  test-pip-packages:
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: ./install-pip-packages.sh

      - name: Run Python tests
        env:
          TERMIN_SDK: ${{ github.workspace }}/sdk
          TERMIN_SHADERC: ${{ github.workspace }}/sdk/bin/termin_shaderc
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          if [[ ! -x "$TERMIN_SHADERC" ]]; then
            echo "ERROR: SDK shader compiler is missing or not executable: $TERMIN_SHADERC" >&2
            exit 1
          fi
          ./setup-sdk-python-env.sh
          TERMIN_TEST_EXECUTION_MANIFEST=${{ github.workspace }}/build/python-execution-manifest.json \
            ./run-tests-python.sh

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-execution-manifest
          path: build/python-execution-manifest.json
          retention-days: 7

  verify-pr-linux-coverage:
    needs: [test-cpp-libs, test-pip-packages]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.test-cpp-libs.result == 'success' && needs.test-pip-packages.result == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v5
        with:
          name: ctest-execution-manifest
          path: build/ci-results/ctest/

      - uses: actions/download-artifact@v5
        with:
          name: python-execution-manifest
          path: build/ci-results/python/

      - name: Verify PR inventory coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/termin-build-tools
        run: |
          mkdir -p build/ci-results
          python -m termin_build.repository_control --repo-root . check
          python -m termin_build.repository_control --repo-root . \
            plan pr --platform linux --json > build/ci-results/expected-pr-linux.json
          python -m termin_build.repository_control verify-execution \
            --expected build/ci-results/expected-pr-linux.json \
            --manifest build/ci-results/ctest/ctest-execution-manifest.json \
            --manifest build/ci-results/python/python-execution-manifest.json

  # ── 5. Build & test termin ───────────────────────────────────────
  test-termin:
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: ./install-pip-packages.sh --editable

      - name: Build termin bundle
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          cd termin-app
          SDK_PREFIX=${{ github.workspace }}/sdk CMAKE_PREFIX_PATH=${{ github.workspace }}/sdk ./build.sh

      - name: Verify relocated installed Python layout
        run: |
          bundle_root="$RUNNER_TEMP/termin-installed"
          cp -a termin-app/install "$bundle_root"
          site_packages="$(find "$bundle_root/lib" -mindepth 2 -maxdepth 3 -type d -path '*/python*/site-packages' -print -quit)"
          test -n "$site_packages"
          test ! -e "$bundle_root/lib/python"
          env -u PYTHONPATH -u PYTHONHOME -u PYTHONUSERBASE \
            LD_LIBRARY_PATH="$bundle_root/lib" \
            "$bundle_root/bin/termin_launcher" --termin-python-layout-smoke > "$RUNNER_TEMP/termin-python-layout.json"
          python3 - "$RUNNER_TEMP/termin-python-layout.json" "$site_packages" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          expected = pathlib.Path(sys.argv[2]).resolve()
          payload = json.loads(report.read_text(encoding="utf-8").splitlines()[-1])
          for module, location in payload.items():
              resolved = pathlib.Path(location).resolve()
              if not resolved.is_relative_to(expected):
                  raise SystemExit(f"{module} imported outside canonical site-packages: {resolved}")
          PY

      - name: Run tests
        env:
          TERMIN_SDK: ${{ github.workspace }}/sdk
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          sdk/bin/termin_python -m termin_build.repository_control \
            --repo-root . plan sdk-installed --platform linux --json \
            > build/expected-sdk-installed-linux.json
          sdk/bin/termin_python -m termin_build.repository_control \
            --repo-root . run sdk-installed --platform linux \
            --executor process-smoke \
            --report-output build/termin-app-installed-execution-manifest.json
          sdk/bin/termin_python -m termin_build.repository_control \
            verify-execution \
            --expected build/expected-sdk-installed-linux.json \
            --manifest build/termin-app-installed-execution-manifest.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: termin-app-installed-execution-manifest
          path: build/termin-app-installed-execution-manifest.json
          retention-days: 7

  # ── 6. Build termin-csharp ──────────────────────────────────────
  test-csharp:
    needs: test-termin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          extra-packages: swig

      - uses: actions/download-artifact@v5
        with:
          name: sdk-full
          path: sdk/

      - name: Resolve SDK Python layout
        uses: ./.github/actions/resolve-sdk-python

      - name: Restore SDK executable permissions
        run: chmod +x sdk/bin/*

      - name: Install pip packages
        env:
          TERMIN_BINDINGS_DIR: ${{ env.SDK_SITE_PACKAGES }}
        run: ./install-pip-packages.sh

      - name: Build termin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/lib
        run: |
          cd termin-app
          SDK_PREFIX=${{ github.workspace }}/sdk CMAKE_PREFIX_PATH=${{ github.workspace }}/sdk ./build.sh

      - name: Build termin-csharp
        run: |
          cmake -S termin-csharp -B termin-csharp/build/Release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/sdk \
            -DTERMIN_CSHARP_BUILD_NATIVE=ON \
            -DTERMIN_CSHARP_BUILD_MANAGED=ON \
            -DTERMIN_CSHARP_BUILD_TESTS=ON
          cmake --build termin-csharp/build/Release --parallel $(nproc)
