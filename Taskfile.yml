version: '3'

silent: true

tasks:
  default:
    desc: Show the repository command menu
    cmds:
      - task --list

  build:
    desc: Build the thin Graphics SDK layer against an installed Core SDK
    platforms: [linux]
    cmds:
      - ./scripts/build/sdk.sh {{.CLI_ARGS}}

  compose:
    desc: Compose the existing Graphics layer over Core into sdk-complete
    platforms: [linux]
    cmds:
      - ./scripts/compose-sdk.sh {{.CLI_ARGS}}

  test:
    desc: Build the Graphics layer and verify the composed SDK
    platforms: [linux]
    cmds:
      - ./scripts/build/sdk.sh {{.CLI_ARGS}}
      - ./scripts/compose-sdk.sh {{.CLI_ARGS}}
      - ./scripts/test/render-core.sh {{.CLI_ARGS}}
      - ./scripts/smoke-installed-graphics-consumers --sdk-root sdk --complete-sdk sdk-complete {{.CLI_ARGS}}

  smoke:
    desc: Verify Core and the existing Graphics layer after relocation
    platforms: [linux]
    cmds:
      - ./scripts/compose-sdk.sh {{.CLI_ARGS}}
      - ./scripts/smoke-installed-graphics-consumers --sdk-root sdk --complete-sdk sdk-complete {{.CLI_ARGS}}

  toolchain:slang:
    desc: Install the pinned Slang compiler
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-slang-toolchain.sh {{.CLI_ARGS}}

  toolchain:web-shaders:
    desc: Install the pinned Slang and Naga shader toolchain
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-web-shader-toolchain.sh {{.CLI_ARGS}}

  toolchain:web:
    desc: Install the pinned Emscripten toolchain
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-web-toolchain.sh {{.CLI_ARGS}}
