version: '3'

silent: true

tasks:
  default:
    desc: Show the repository command menu
    cmds:
      - task --list

  build:
    desc: Build the composed Graphics SDK from an installed Core SDK
    platforms: [linux]
    cmds:
      - ./scripts/build/sdk.sh {{.CLI_ARGS}}

  test:
    desc: Build and verify standalone installed Graphics consumers
    platforms: [linux]
    cmds:
      - ./scripts/build/sdk.sh {{.CLI_ARGS}}
      - ./scripts/smoke-installed-graphics-consumers --sdk-root sdk

  smoke:
    desc: Verify the existing installed Graphics SDK after relocation
    platforms: [linux]
    cmds:
      - ./sdk/bin/termin_python -I scripts/smoke-installed-graphics-consumers --sdk-root sdk

  toolchain:slang:
    desc: Install the pinned Slang compiler
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-slang-toolchain.sh {{.CLI_ARGS}}

  toolchain:web-shaders:
    desc: Install the pinned Slang and Naga shader toolchain
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-web-shader-toolchain.sh {{.CLI_ARGS}}

  toolchain:web:
    desc: Install the pinned Emscripten toolchain
    platforms: [linux]
    cmds:
      - ./scripts/build/setup-web-toolchain.sh {{.CLI_ARGS}}
